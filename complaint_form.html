{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">NEW REPORT</p><h1>Register a complaint</h1><p>Do not include names, phone numbers or precise home addresses.</p></div></div><form class="panel form-grid" method="post"><label>Category<select name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Locality<select name="locality" required>{% for l in localities %}<option>{{ l }}</option>{% endfor %}</select></label><label class="wide">Landmark or road description<input name="location_description" maxlength="160" required placeholder="e.g. Karve Road junction"></label><label class="wide">Describe the issue<textarea name="description" maxlength="1000" rows="4" required></textarea></label><label>Severity (1–5)<input type="number" name="severity" min="1" max="5" value="3" required></label><label>Estimated affected people<input type="number" name="affected_people" min="0" value="0" required></label><div class="wide"><button class="button">Save complaint</button></div></form>{% endblock %}
