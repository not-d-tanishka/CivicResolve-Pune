<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CivicResolve Pune{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="site-header"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-name">CivicResolve</span><span class="brand-place">Pune</span></a><div class="header-note">Community complaint priority project</div></header><nav class="site-nav"><div class="nav-inner"><a class="{{ 'active' if request.endpoint=='main.index' }}" href="{{ url_for('main.index') }}">Overview</a><a class="{{ 'active' if request.endpoint in ['main.complaints','main.new_complaint','main.complaint_detail'] }}" href="{{ url_for('main.complaints') }}">Reports</a><a class="{{ 'active' if request.endpoint in ['main.duplicates','main.decide_duplicate'] }}" href="{{ url_for('main.duplicates') }}">Review matches</a><a class="{{ 'active' if request.endpoint in ['main.issues','main.issue_detail'] }}" href="{{ url_for('main.issues') }}">Issue queue</a><a class="{{ 'active' if request.endpoint in ['main.analytics','main.benchmark'] }}" href="{{ url_for('main.analytics') }}">Statistics</a><a class="{{ 'active' if request.endpoint=='main.dsa_lab' }}" href="{{ url_for('main.dsa_lab') }}">DSA Lab</a></div></nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for type,message in messages %}<div class="flash {{ type }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
